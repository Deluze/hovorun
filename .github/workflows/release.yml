# Builds hovorun_server for Windows, Linux and macOS and publishes a GitHub release.
#
# Push a tag like v0.1.0 to build and release. "Run workflow" (manual) builds and uploads the packages as
# workflow artifacts without creating a release.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            arch: x64
          - name: linux-x64
            os: ubuntu-24.04
          - name: linux-arm64
            os: ubuntu-24.04-arm
          - name: macos-arm64
            os: macos-latest
          - name: macos-x64
            os: macos-13

    steps:
      - uses: actions/checkout@v4

      # Windows: MSVC (/std:c++latest), static CRT so the exe runs without the VC++ redistributable.
      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch }}

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded

      # Linux: GCC 14 (std::print, deducing this, ranges::to). libstdc++/libgcc linked statically so the binary
      # runs on distributions with an older system compiler.
      - name: Install toolchain (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y g++-14 ninja-build

      - name: Configure (Linux)
        if: runner.os == 'Linux'
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_CXX_COMPILER=g++-14
          "-DCMAKE_EXE_LINKER_FLAGS=-static-libstdc++ -static-libgcc"

      # macOS: Apple Clang lags behind on C++23/26, so use Homebrew LLVM and link its libc++ statically.
      - name: Install toolchain (macOS)
        if: runner.os == 'macOS'
        run: brew install llvm ninja

      - name: Configure (macOS)
        if: runner.os == 'macOS'
        run: |
          LLVM="$(brew --prefix llvm)"
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER="$LLVM/bin/clang++" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0 \
            "-DCMAKE_EXE_LINKER_FLAGS=-nostdlib++ $LLVM/lib/c++/libc++.a $LLVM/lib/c++/libc++abi.a"

      - name: Build
        run: cmake --build build --config Release

      - name: Package
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME//\//-}"
          PACKAGE="hovorun-server-${VERSION}-${{ matrix.name }}"
          cmake --install build --prefix "dist/$PACKAGE"
          cd dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a "$PACKAGE.zip" "$PACKAGE" > /dev/null
            echo "ASSET=dist/$PACKAGE.zip" >> "$GITHUB_ENV"
          else
            tar -czf "$PACKAGE.tar.gz" "$PACKAGE"
            echo "ASSET=dist/$PACKAGE.tar.gz" >> "$GITHUB_ENV"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ env.ASSET }}

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: packages/*
          generate_release_notes: true
