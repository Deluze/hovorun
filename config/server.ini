; Hovorun server configuration. Session and messenger ports must match the client's cliconfg.inp.

[session]
port=23111

[messenger]
port=24111

[game]
; The session server sends this address to clients after login. Use your LAN/public IP for remote clients.
public_ip=127.0.0.1
port=25111

[accounts]
; One "username password" pair per line.
file=accounts.txt
; Create an account the first time an unknown username logs in.
auto_register=true

[log]
; debug, info, warn, error
level=info
